name: Deploy Frontend to IIS (Fixed IIS Path Update)

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # 🏷️ Tạo mã version tự động
      - name: Set Release Version
        id: version
        run: echo "DEPLOY_VERSION=v${{ github.run_number }}" >> $GITHUB_ENV

      # 📁 Tạo folder version mới trên VPS
      - name: Create New Version Folder
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            powershell -Command "New-Item -ItemType Directory -Force -Path 'C:\inetpub\wwwroot\DCSE_V2_Client\${{ env.DEPLOY_VERSION }}\dist'"

      # 📦 Copy file build lên VPS vào folder version MỚI
      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist"
          target: "C:/inetpub/wwwroot/DCSE_V2_Client/${{ env.DEPLOY_VERSION }}/dist"
          strip_components: 1
          
      # 🔄 Cập nhật IIS Path và Restart
      - name: Update IIS Path and Restart
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "Import-Module WebAdministration; $path = 'C:\inetpub\wwwroot\DCSE_V2_Client\${{ env.DEPLOY_VERSION }}\dist'; if (-Not (Test-Path $path)) { throw 'Loi: Thu muc khong ton tai' }; Set-ItemProperty 'IIS:\Sites\DCS_V2' -Name physicalPath -Value $path; C:\Windows\System32\inetsrv\appcmd.exe recycle apppool /apppool.name:DCS_V2; Start-Sleep -Seconds 2; C:\Windows\System32\inetsrv\appcmd.exe start apppool /apppool.name:DCS_V2; C:\Windows\System32\inetsrv\appcmd.exe start site /site.name:DCS_V2; Write-Host 'Deploy FE thanh cong!'"
