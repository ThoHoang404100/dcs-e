name: Deploy Frontend to IIS (Multi-Environment)

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Chọn môi trường để deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set Environment Variables
        run: |
          TARGET_ENV="production"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            TARGET_ENV="production"
          fi
          
          if [ "$TARGET_ENV" = "production" ]; then
            echo "DEPLOY_PATH_WIN=C:\inetpub\wwwroot\DCSE_ProductionV2_Client" >> $GITHUB_ENV
            echo "DEPLOY_PATH_NIX=C:/inetpub/wwwroot/DCSE_ProductionV2_Client" >> $GITHUB_ENV
            echo "IIS_SITE=DCSE_Production_V2_Client" >> $GITHUB_ENV
            echo "IIS_APPPOOL=DCSE_Production_V2_Client" >> $GITHUB_ENV
            echo "API_URL=https://apiproduction.dcse.vn/" >> $GITHUB_ENV
          else
            # Tạm thời cấu hình nhánh main cũng deploy chung vào thư mục Production
            echo "DEPLOY_PATH_WIN=C:\inetpub\wwwroot\DCSE_ProductionV2_Client" >> $GITHUB_ENV
            echo "DEPLOY_PATH_NIX=C:/inetpub/wwwroot/DCSE_ProductionV2_Client" >> $GITHUB_ENV
            echo "IIS_SITE=DCSE_Production_V2_Client" >> $GITHUB_ENV
            echo "IIS_APPPOOL=DCSE_Production_V2_Client" >> $GITHUB_ENV
            echo "API_URL=https://apiproduction.dcse.vn/" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "${{ secrets.DOTENV }}" > .env
          if [ -n "${{ env.API_URL }}" ]; then
            echo "" >> .env
            echo "VITE_SERVER_URL=${{ env.API_URL }}" >> .env
          fi

      - name: Build project
        run: npm run build -- --outDir dist

      # 📦 Nén file build
      - name: Zip build
        run: |
          cd dist
          zip -r ../build.zip .
          cd ..

      # 📁 Đảm bảo thư mục tồn tại trên VPS
      - name: Ensure Directory Exists
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "if (-Not (Test-Path '${{ env.DEPLOY_PATH_WIN }}')) { New-Item -ItemType Directory -Force -Path '${{ env.DEPLOY_PATH_WIN }}' }"

      # 🚀 Upload file nén lên VPS bằng scp
      - name: Upload Build
        env:
          SSHPASS: ${{ secrets.VPS_PASS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -e scp -o StrictHostKeyChecking=no build.zip ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:"${{ env.DEPLOY_PATH_NIX }}/build.zip"
          
      # 🔄 Giải nén, cập nhật IIS Path và Restart
      - name: Extract and Update IIS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $path = '${{ env.DEPLOY_PATH_WIN }}'; C:\Windows\System32\inetsrv\appcmd.exe stop site /site.name:${{ env.IIS_SITE }} 2> $null; C:\Windows\System32\inetsrv\appcmd.exe stop apppool /apppool.name:${{ env.IIS_APPPOOL }} 2> $null; Start-Sleep -Seconds 2; if (Test-Path $path) { Get-ChildItem -Path $path -Exclude 'Sharing','build.zip','web.config' | Remove-Item -Recurse -Force }; Expand-Archive -Path ($path + '\build.zip') -DestinationPath $path -Force; Remove-Item -Path ($path + '\build.zip') -Force; Import-Module WebAdministration; if (-Not (Test-Path $path)) { throw 'Loi: Thu muc khong ton tai' }; if (Test-Path ($path + '\Sharing')) { Copy-Item -Path ($path + '\Sharing\*.*') -Destination $path -Force }; Set-ItemProperty 'IIS:\Sites\${{ env.IIS_SITE }}' -Name physicalPath -Value $path; C:\Windows\System32\inetsrv\appcmd.exe start apppool /apppool.name:${{ env.IIS_APPPOOL }}; C:\Windows\System32\inetsrv\appcmd.exe start site /site.name:${{ env.IIS_SITE }}; Write-Host 'Deploy FE ${{ env.TARGET_ENV }} thanh cong!'"
